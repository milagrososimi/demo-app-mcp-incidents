apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      # An authorization in flight should be allowed to finish rather than
      # be cut off when a pod is replaced.
      terminationGracePeriodSeconds: 45
      containers:
        - name: payment-service
          image: registry.internal/payment-service:latest
          env:
            - name: UPSTREAM_URL
              value: "https://processor.internal"
            # Per attempt, not per authorization: a retry starts its own.
            # The processor publishes a 2s p99, so an attempt that outlives
            # it has already lost its answer.
            - name: UPSTREAM_TIMEOUT
              value: "2s"
            - name: UPSTREAM_RETRIES
              value: "2"
