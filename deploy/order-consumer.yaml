apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-consumer
  labels:
    app: order-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-consumer
  template:
    metadata:
      labels:
        app: order-consumer
    spec:
      containers:
        - name: order-consumer
          image: registry.internal/order-consumer:latest
          env:
            # Sized against the broker's per-fetch limit on the new cluster.
            - name: CONSUMER_BATCH_SIZE
              value: "100"
            - name: CONSUMER_POLL_COST
              value: "40ms"
            - name: CONSUMER_WORK_COST
              value: "100us"
            - name: CONSUMER_BACKLOG
              value: "5000"
