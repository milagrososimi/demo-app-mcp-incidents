apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: registry.internal/payments-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            # Concurrent database connections per replica. Sized against the
            # database's own connection limit divided by the replica count.
            - name: DB_POOL_SIZE
              value: "50"
            - name: DB_QUERY_DURATION
              value: "20ms"
            - name: DB_ACQUIRE_TIMEOUT
              value: "2s"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
